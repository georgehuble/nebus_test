name: Bug report
description: Report a reproducible defect in the service.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much detail as
        you can — a minimal, reproducible report is the fastest path to a fix.

        For security-sensitive issues, do **not** use this template; see
        [SECURITY.md](https://github.com/georgehuble/nebus_test/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the defect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or API calls that trigger the problem.
      placeholder: |
        1. Start the stack with `docker compose up -d --build api consumer`
        2. Send `POST /api/v1/payments` with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, logs or stack traces where relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA where the bug was observed.
      placeholder: "v0.1.0"
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - api
        - consumer
        - outbox / relay
        - retry / DLQ
        - webhook delivery
        - gateway emulator
        - migrations
        - tooling / CI
        - other / unsure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, Python version, relevant configuration.
    validations:
      required: false
