[project]
name = "async-payment-processing"
version = "0.1.0"
description = "Asynchronous payment processing microservice with transactional Outbox, bounded retries and webhook delivery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests", "migrations"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test helpers expose a polling ``timeout`` budget rather than an asyncio.timeout block.
"tests/**/*.py" = ["B011", "ASYNC109"]

[tool.ruff.format]
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aio_pika.*", "aiormq.*"]
# aio-pika ships usable stubs; relax only genuinely untyped call surfaces.
disallow_any_generics = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, isolated tests without external infrastructure",
    "integration: tests requiring real PostgreSQL and RabbitMQ",
    "e2e: full-stack end-to-end scenarios",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
